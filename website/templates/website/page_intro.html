<section class="page-intro page-intro-split">
  <div class="page-intro-glow"></div>
  <div class="page-intro-grid">
    <div class="page-intro-content page-intro-copy-block">
      <p class="eyebrow">{{ eyebrow }}</p>
      <h1>{{ title }}</h1>
      <p class="section-lead">{{ description }}</p>
    </div>

    <aside class="page-intro-aside">
      <article class="page-intro-note">
        <p class="micro-copy">Sunday Rhythm</p>
        <h2>{{ service_time }}</h2>
        <p class="page-intro-note-copy">{{ location }} / {{ landmark }}</p>
      </article>

      <div class="page-intro-chip-row">
        <span class="page-intro-chip">{{ theme_2026.badge }}</span>
        <span class="page-intro-chip">{{ service_name }}</span>
      </div>
    </aside>
  </div>
</section>
